# Render Blueprint — Home Service Technician Matching & Booking (Kidapawan City).
# Spec: https://render.com/docs/blueprint-spec   Steps: docs/DEPLOY.md
#
# The PostgreSQL 18 database (db_service_platform, Singapore) already exists and is NOT created here:
# paste its INTERNAL Database URL into DATABASE_URL when you apply the Blueprint.
# Live hosts: API https://home-service-api-32a1.onrender.com (Render added the -32a1 suffix), web
# https://home-service-web.onrender.com. If a hostname changes again, update
# CORS_ALLOWED_ORIGINS + CSRF_TRUSTED_ORIGINS (api) and VITE_API_BASE_URL + VITE_WS_BASE_URL (web, then redeploy).

services:
  # Django + Channels (Daphne) API, with a Celery worker + embedded beat in the same container (scripts/start.sh).
  - type: web
    name: home-service-api
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: sh scripts/start.sh
    healthCheckPath: /api/health/
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false # INTERNAL URL of the existing Render database
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: home-service-api-32a1.onrender.com,.onrender.com,localhost,127.0.0.1
      - key: CORS_ALLOWED_ORIGINS
        value: https://home-service-web.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://home-service-api-32a1.onrender.com,https://home-service-web.onrender.com
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: home-service-redis
          property: connectionString
      - key: BOOKING_BLOCK_MINUTES
        value: "120"

  # Redis-compatible Key Value: Channels layer + Celery broker. Empty allow list = private network only.
  - type: keyvalue
    name: home-service-redis
    region: singapore
    plan: free
    maxmemoryPolicy: noeviction # broker/channel data must not be silently evicted
    ipAllowList: []

  # React + Vite SPA. Static sites are served from Render's global CDN (no region setting).
  - type: web
    name: home-service-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    # PWA: the service worker, its registration script and the manifest must always be revalidated so
    # updates reach installed apps; Vite's content-hashed /assets/* can be cached for a year.
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /registerSW.js # not emitted today (registration is bundled); kept in case injectRegister changes
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    # SPA fallback. Render never applies rewrite rules to a path where a file exists, so /sw.js,
    # /manifest.webmanifest, icons and /assets/* are served as files, not index.html.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22.17.1
      - key: VITE_API_BASE_URL
        value: https://home-service-api-32a1.onrender.com/api
      - key: VITE_WS_BASE_URL
        value: wss://home-service-api-32a1.onrender.com/ws
      - key: VITE_GOOGLE_MAPS_API_KEY
        sync: false # the Google Maps browser key (map_platform_api_key.txt)
      - key: VITE_GOOGLE_MAPS_MAP_ID
        value: DEMO_MAP_ID
